name: UseBy
options:
  bundleIdPrefix: com.usebyapp
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    DEVELOPMENT_TEAM: Z992574579
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ENABLE_PREVIEWS: YES

targets:
  UseBy:
    type: application
    platform: iOS
    sources:
      - path: UseBy
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.usebyapp.UseBy
        PRODUCT_NAME: UseBy
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.food-and-drink
    info:
      path: UseBy/Resources/Info.plist
      properties:
        CFBundleDisplayName: UseBy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.food-and-drink
        NSCameraUsageDescription: UseBy uses the camera to scan grocery barcodes so it can fill in product names for you.
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.usebyapp.UseBy
            CFBundleURLSchemes:
              - useby
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: UseBy/Resources/UseBy.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.usebyapp.UseBy
    dependencies:
      - target: UseByWidget

  UseByWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: UseByWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.usebyapp.UseBy.Widget
        PRODUCT_NAME: UseByWidget
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: UseByWidget/Info.plist
      properties:
        CFBundleDisplayName: UseBy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: UseByWidget/UseByWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.usebyapp.UseBy

  UseByTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: UseByTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.usebyapp.UseByTests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: UseBy

schemes:
  UseBy:
    build:
      targets:
        UseBy: all
        UseByWidget: all
        UseByTests: [test]
    run:
      config: Debug
      commandLineArguments:
        "-seedSampleData": false
        "-resetData": false
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - UseBy
      targets:
        - UseByTests
    archive:
      config: Release
